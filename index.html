<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando Conexão...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
        }
        /* Tela do Cronômetro: Fica por cima de tudo tampando a notícia */
        #overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            padding: 30px;
            max-width: 400px;
            width: 90%;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        h2 { font-size: 1.2rem; margin-bottom: 10px; color: #222; }
        p { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
        .timer { font-size: 2.5rem; font-weight: bold; color: #007bff; }
        
        /* O iFrame que roda a notícia de verdade por trás em tamanho cheio */
        #background-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Camada de Cima: O que o usuário vê -->
    <div id="overlay-screen">
        <div class="container">
            <div class="loader"></div>
            <h2>Carregando conteúdo seguro...</h2>
            <p>Aguarde enquanto preparamos a matéria completa para você.</p>
            <div class="timer" id="countdown">15</div>
        </div>
    </div>

    <!-- Camada de Baixo: A notícia rodando e gerando retenção desde o segundo zero -->
    <iframe 
        id="background-frame" 
        src="https://coisasdecasal.com"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
    </iframe>

    <script>
        const urlDestino = "https://informativododia.com/2026/10/13/quem-e-o-gostoso-da-paulista-o-homem-descamisado-que-viralizou-na-manifestacao-de-lula/?utm_campaign=1891&utm_medium=67119547&utm_term=1529&utm_source=54f502431553a8";
        let tempoRestante = 15;
        const countdownElement = document.getElementById('countdown');
        const overlay = document.getElementById('overlay-screen');

        // Proteção preventiva contra scripts de Frame-Busting do site alvo
        let preventBusting = 0;
        window.onbeforeunload = function() { 
            preventBusting++;
            if (preventBusting > 0) {
                // Impede que o iFrame force a página principal a fechar ou redirecionar antes da hora
                return "Aguarde o carregamento..."; 
            }
        };

        const contador = setInterval(() => {
            tempoRestante--;
            countdownElement.textContent = tempoRestante;

            if (tempoRestante <= 0) {
                clearInterval(contador);
                
                // Desativa a trava preventiva de saída
                window.onbeforeunload = null; 
                
                // Remove a tela branca e revela a notícia que já estava aberta e pontuando por trás
                overlay.style.display = 'none';
                
                // Redireciona a janela principal para garantir que o usuário interaja diretamente na raiz da URL
                window.location.replace(urlDestino);
            }
        }, 1000);
    </script>

</body>
</html>
