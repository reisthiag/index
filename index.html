<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Security Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #0e1118; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; }
    .card-filtro { background: #161c2a; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 88%; max-width: 400px; text-align: center; border: 1px solid #242f47; }
    .icon-shield { font-size: 50px; color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.3); margin-bottom: 15px; }
    h2 { font-size: 20px; margin: 0 0 10px 0; color: #ffffff; font-weight: 700; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 25px 0; }
    .btn-prosseguir { 
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); 
      color: #000000; border: none; padding: 16px 20px; font-size: 16px; 
      font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; 
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4); text-transform: uppercase; 
      letter-spacing: 0.5px; transition: transform 0.1s, filter 0.2s; 
    }
    .btn-prosseguir:hover { filter: brightness(1.1); }
    .btn-prosseguir:active { transform: scale(0.98); }
    .footer-secure { font-size: 11px; color: #64748b; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 5px; }
    
    /* Oculta as barras e elementos visuais padrão do script do Google Translate */
    .skiptranslate, .goog-te-banner-frame { display: none !important; }
    body { top: 0px !important; }
  </style>
</head>
<body>

  <!-- Elemento técnico oculto para processamento da tradução pelo Google -->
  <div id="google_translate_element" style="display:none;"></div>

  <div class="card-filtro">
    <div class="icon-shield">🛡️</div>
    
    <!-- Os textos nativos em inglês serão convertidos automaticamente para o idioma do visitante -->
    <h2>Human Verification</h2>
    <p>Confirm that you are not a robot to access the exclusive content immediately.</p>
    
    <button class="btn-prosseguir" id="btnLink">Click to Continue</button>
    
    <div class="footer-secure">
      🔒 Encrypted and secure connection by your browser
    </div>
  </div>

  <!-- Inicialização dinâmica do motor de tradução do Google -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      let userLang = (navigator.language || navigator.userLanguage).split('-');
      
      new google.translate.TranslateElement({
        pageLanguage: 'en', 
        includedLanguages: userLang, 
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');

      setTimeout(function() {
        let select = document.querySelector('select.goog-te-combo');
        if (select) {
          select.value = userLang;
          select.dispatchEvent(new Event('change'));
        }
      }, 100);
    }
  </script>
  <script type="text/javascript" src="//://google.com"></script>

  <script>
    // URL Final do seu Smartlink Adsterra atualizada
    const meuSmartlink = "https://www.profitableratecpmnetwork.com/pte18rjq?key=6c6944d9dd549a0f9535d0f4b98e69d9";
    
    // Captura os parâmetros dinâmicos de rastreamento (ex: ?cid=) para repassar à Adsterra
    const paramsAtuais = window.location.search;
    const urlFinalComParams = meuSmartlink + (meuSmartlink.includes('?') ? '&' : '?') + paramsAtuais.replace('?', '');

    // Evento de clique para o usuário real avançar com segurança
    document.getElementById('btnLink').addEventListener('click', function() {
      window.location.href = urlFinalComParams;
    });

    /* Mecanismo Anti-Bots para travar o botão físico de voltar do dispositivo */
    (function() {
      window.history.pushState({ page: 1 }, "", window.location.href);
      window.onpopstate = function() {
        window.history.pushState({ page: 1 }, "", window.location.href);
      };
    })();
  </script>
</body>
</html>
